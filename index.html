<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f3460">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MET Routes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>MET Route Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <header id="header">
      <button id="btn-back" class="btn-icon hidden" aria-label="Back">&#8592;</button>
      <h1 id="header-title">MET Routes</h1>
      <button id="btn-sync" class="btn-icon" aria-label="Sync">&#8635;</button>
    </header>

    <div id="status-bar" class="hidden" role="status"></div>

    <!-- Screen: Route List -->
    <div id="screen-routes" class="screen active">
      <div id="route-list-container">
        <div id="route-list"></div>
        <div id="no-routes" class="empty-state hidden">
          <div class="empty-icon">&#128205;</div>
          <p>No routes available.</p>
          <p class="dim">Ask your dispatcher to send routes, then tap Sync.</p>
          <button id="btn-sync-empty" class="btn-primary">Sync Now</button>
        </div>
      </div>
      <div id="version-bar">MET Route Viewer <span id="version-num"></span></div>
    </div>

    <!-- Screen: Route Map + Stop List -->
    <div id="screen-route" class="screen hidden">
      <div id="map"></div>

      <div id="view-toggle">
        <button id="btn-map-view" class="active">Map</button>
        <button id="btn-list-view">List</button>
      </div>

      <div id="stop-panel">
        <div id="stop-list"></div>
      </div>

      <!-- Bottom sheet: stop detail -->
      <div id="stop-detail" class="hidden">
        <button id="btn-close-detail" aria-label="Close">&#10005;</button>
        <div id="detail-order"></div>
        <h2 id="detail-name"></h2>
        <div id="detail-address"></div>
        <div id="detail-meta"></div>
        <div id="detail-actions">
          <button id="btn-navigate" class="btn-nav">Navigate</button>
          <button id="btn-mark-done" class="btn-done">Mark Done</button>
        </div>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
